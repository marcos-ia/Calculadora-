<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherHabit SaaS - Habit Tracker Pro</title>
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chart.js & Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* VARIABLES DE TEMAS Y COLORES */
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151d2a;
      --bg-header: #111827;
      --bg-hover: #1e293b;
      --border-color: #273549;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-primary: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --status-completed: #10b981;
      --radius: 16px;
      --shadow: 0 10px 30px -5px rgba(0,0,0,0.3);
    }

    /* TEMAS DE COLOR */
    [data-theme="light"] { --bg-main: #f1f5f9; --bg-card: #ffffff; --bg-header: #ffffff; --bg-hover: #e2e8f0; --border-color: #cbd5e1; --text-main: #0f172a; --text-muted: #64748b; --accent-primary: #4f46e5; }
    [data-theme="midnight-purple"] { --bg-main: #120924; --bg-card: #1e1035; --bg-header: #1a0d30; --bg-hover: #2d184f; --border-color: #3b1f66; --text-main: #f5f3ff; --text-muted: #a78bfa; --accent-primary: #8b5cf6; }
    [data-theme="emerald-forest"] { --bg-main: #062016; --bg-card: #0b2e21; --bg-header: #08271c; --bg-hover: #124533; --border-color: #195c45; --text-main: #ecfdf5; --text-muted: #6ee7b7; --accent-primary: #10b981; }
    [data-theme="sunset-crimson"] { --bg-main: #210811; --bg-card: #330f1c; --bg-header: #2b0b17; --bg-hover: #481729; --border-color: #5e2037; --text-main: #fff1f2; --text-muted: #fda4af; --accent-primary: #f43f5e; }
    [data-theme="ocean-deep"] { --bg-main: #031525; --bg-card: #08233c; --bg-header: #051c31; --bg-hover: #0f365c; --border-color: #164878; --text-main: #f0f9ff; --text-muted: #7dd3fc; --accent-primary: #0284c7; }
    [data-theme="cyberpunk-neon"] { --bg-main: #0d0221; --bg-card: #19053d; --bg-header: #13032e; --bg-hover: #290861; --border-color: #ff007f; --text-main: #00f5ff; --text-muted: #ff77bc; --accent-primary: #ff007f; }
    [data-theme="nordic-frost"] { --bg-main: #2e3440; --bg-card: #3b4252; --bg-header: #353c4a; --bg-hover: #434c5e; --border-color: #4c566a; --text-main: #eceff4; --text-muted: #88c0d0; --accent-primary: #81a1c1; }
    [data-theme="warm-amber"] { --bg-main: #1c130b; --bg-card: #2c1e13; --bg-header: #24180e; --bg-hover: #3e2b1b; --border-color: #543c27; --text-main: #fffbeb; --text-muted: #fcd34d; --accent-primary: #f59e0b; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 2rem 1rem; }

    #app-container { width: 100%; max-width: 1200px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }

    .app-header { background: var(--bg-header); padding: 1.5rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
    .brand-title { font-size: 1.5rem; font-weight: 800; color: var(--accent-primary); display: flex; align-items: center; gap: 0.75rem; }
    .header-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .btn { padding: 0.65rem 1.2rem; border-radius: 10px; border: none; font-weight: 700; font-size: 0.875rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-primary { background: var(--accent-primary); color: #ffffff; }
    .btn-secondary { background: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border-color); }

    .theme-palette-bar { background: var(--bg-header); padding: 1rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 1rem; overflow-x: auto; }
    .theme-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border-color); cursor: pointer; flex-shrink: 0; }
    .theme-swatch.active { transform: scale(1.2); border-color: var(--text-main); }

    .nav-tabs { display: flex; background: var(--bg-header); padding: 0 2rem; border-bottom: 1px solid var(--border-color); gap: 0.5rem; overflow-x: auto; }
    .tab-btn { padding: 1rem 1.25rem; color: var(--text-muted); font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 0.6rem; white-space: nowrap; }
    .tab-btn.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }

    .main-body { padding: 2rem; }
    .view-pane { display: none; }
    .view-pane.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .matrix-wrapper { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius); overflow-x: auto; margin-bottom: 2rem; }
    .matrix-table { width: 100%; border-collapse: collapse; min-width: 900px; }
    .matrix-table th, .matrix-table td { padding: 0.85rem; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); text-align: center; }
    .matrix-table th:first-child, .matrix-table td:first-child { text-align: left; width: 240px; position: sticky; left: 0; background: var(--bg-card); z-index: 10; }

    .cell-check { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--border-color); margin: 0 auto; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; user-select: none; }
    .cell-check.completed { background: var(--status-completed); border-color: var(--status-completed); color: #fff; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
    .stat-card { background: var(--bg-main); border: 1px solid var(--border-color); padding: 1.25rem; border-radius: var(--radius); }
    .stat-card .lbl { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .stat-card .val { font-size: 1.75rem; font-weight: 800; margin-top: 0.3rem; color: var(--text-main); }

    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    .chart-box { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.5rem; }

    pre.widget-code { background: var(--bg-main); border: 1px solid var(--border-color); padding: 1.25rem; border-radius: 12px; color: #38bdf8; font-family: monospace; font-size: 0.85rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); width: 100%; max-width: 440px; padding: 1.75rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted); }
    .form-input { width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="app-container">
    <header class="app-header">
      <div class="brand-title"><i class="fa-solid fa-fire-flame-curved"></i> AetherHabit SaaS</div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="applyAutoThemeByTime()"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto Hora</button>
        <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Nuevo Hábito</button>
      </div>
    </header>

    <div class="theme-palette-bar">
      <div class="theme-swatch" data-theme="dark" style="background: #0b0f19;" onclick="setTheme('dark')"></div>
      <div class="theme-swatch" data-theme="light" style="background: #f1f5f9;" onclick="setTheme('light')"></div>
      <div class="theme-swatch" data-theme="midnight-purple" style="background: #120924;" onclick="setTheme('midnight-purple')"></div>
      <div class="theme-swatch" data-theme="emerald-forest" style="background: #062016;" onclick="setTheme('emerald-forest')"></div>
      <div class="theme-swatch" data-theme="sunset-crimson" style="background: #210811;" onclick="setTheme('sunset-crimson')"></div>
      <div class="theme-swatch" data-theme="ocean-deep" style="background: #031525;" onclick="setTheme('ocean-deep')"></div>
      <div class="theme-swatch" data-theme="cyberpunk-neon" style="background: #0d0221;" onclick="setTheme('cyberpunk-neon')"></div>
      <div class="theme-swatch" data-theme="nordic-frost" style="background: #2e3440;" onclick="setTheme('nordic-frost')"></div>
      <div class="theme-swatch" data-theme="warm-amber" style="background: #1c130b;" onclick="setTheme('warm-amber')"></div>
    </div>

    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Panel</button>
      <button class="tab-btn" onclick="switchView('analytics', this)"><i class="fa-solid fa-chart-pie"></i> Analíticas</button>
      <button class="tab-btn" onclick="switchView('widget', this)"><i class="fa-solid fa-mobile-screen"></i> ScriptWidget</button>
    </nav>

    <div class="main-body">
      <section id="dashboard" class="view-pane active">
        <div class="stats-grid">
          <div class="stat-card"><div class="lbl">Cumplimiento Mensual</div><div class="val" id="stat-rate">0%</div></div>
          <div class="stat-card"><div class="lbl">Racha</div><div class="val" style="color: #f59e0b;">Activa 🔥</div></div>
          <div class="stat-card"><div class="lbl">Progreso Hoy</div><div class="val" style="color: #10b981;" id="stat-today">0 / 0</div></div>
        </div>
        <div class="matrix-wrapper">
          <table class="matrix-table" id="matrix-table"></table>
        </div>
      </section>

      <section id="analytics" class="view-pane">
        <div class="charts-grid">
          <div class="chart-box"><canvas id="barChart" height="200"></canvas></div>
          <div class="chart-box"><canvas id="doughnutChart" height="200"></canvas></div>
        </div>
      </section>

      <section id="widget" class="view-pane">
        <button class="btn btn-secondary" style="margin-bottom: 1rem;" onclick="copyWidgetCode()"><i class="fa-solid fa-copy"></i> Copiar Código</button>
        <pre class="widget-code" id="widget-code-text"></pre>
      </section>
    </div>
  </div>

  <div class="modal-backdrop" id="habit-modal">
    <div class="modal-box">
      <form onsubmit="saveNewHabit(event)">
        <div class="form-group">
          <label for="habit-name-input">Nuevo Hábito</label>
          <input type="text" id="habit-name-input" class="form-input" placeholder="Ej: Leer 15 páginas" required>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let habits = JSON.parse(localStorage.getItem('aether_habits_saas')) || [
      { id: '1', name: '🧠 Meditación', records: {} },
      { id: '2', name: '🏋️ Ejercicio', records: {} }
    ];
    let barChartInstance = null; 
    let doughnutChartInstance = null;

    function formatDateKey(year, month, day) {
      const m = String(month + 1).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${year}-${m}-${d}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('aether_custom_theme') || 'dark';
      setTheme(savedTheme, false);
      renderMatrix();
    });

    function setTheme(themeName, isUser = true) {
      document.documentElement.setAttribute('data-theme', themeName);
      if (isUser) localStorage.setItem('aether_custom_theme', themeName);
      
      document.querySelectorAll('.theme-swatch').forEach(s => {
        s.classList.toggle('active', s.getAttribute('data-theme') === themeName);
      });

      if (barChartInstance) renderMatrix();
    }

    function applyAutoThemeByTime() {
      const isNight = new Date().getHours() >= 20 || new Date().getHours() < 7;
      setTheme(isNight ? 'dark' : 'light', true);
    }

    function saveState() { 
      localStorage.setItem('aether_habits_saas', JSON.stringify(habits)); 
    }

    function renderMatrix() {
      const table = document.getElementById('matrix-table');
      const now = new Date(); 
      const year = now.getFullYear();
      const month = now.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayDay = now.getDate();
      
      let html = `<thead><tr><th>Hábito</th>` + Array.from({length: daysInMonth}, (_, i) => `<th>${i+1}</th>`).join('') + `</tr></thead><tbody>`;
      let totalCompleted = 0;
      let todayTotal = 0;

      habits.forEach(h => {
        html += `<tr><td><b>${h.name}</b></td>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const key = formatDateKey(year, month, d);
          const ok = h.records[key] === 'completed';
          if (ok) totalCompleted++; 
          if (d === todayDay && ok) todayTotal++;
          html += `<td><div class="cell-check ${ok ? 'completed' : ''}" onclick="toggleCell('${h.id}', '${key}')">${ok ? '✓' : ''}</div></td>`;
        }
        html += `</tr>`;
      });
      table.innerHTML = html + `</tbody>`;

      const maxPossible = habits.length * daysInMonth;
      const ratePct = maxPossible > 0 ? Math.round((totalCompleted / maxPossible) * 100) : 0;
      
      document.getElementById('stat-rate').innerText = ratePct + '%';
      document.getElementById('stat-today').innerText = `${todayTotal} / ${habits.length}`;

      renderAnalytics(daysInMonth, now);
      generateScriptWidgetCode(todayTotal, habits.length);
    }

    function toggleCell(id, dateKey) {
      const h = habits.find(x => x.id === id);
      if (!h) return;
      if (h.records[dateKey]) {
        delete h.records[dateKey];
      } else { 
        h.records[dateKey] = 'completed'; 
        if (typeof confetti === 'function') confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
      }
      saveState(); 
      renderMatrix();
    }

    function renderAnalytics(days, now) {
      if (!document.getElementById('barChart') || !document.getElementById('doughnutChart')) return;
      
      const year = now.getFullYear();
      const month = now.getMonth();
      const labels = Array.from({length: days}, (_, i) => i + 1);
      
      const data = labels.map(d => {
        const key = formatDateKey(year, month, d);
        return habits.filter(h => h.records[key] === 'completed').length;
      });

      const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim() || '#6366f1';
      const borderCol = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim() || '#273549';

      if (barChartInstance) barChartInstance.destroy();
      barChartInstance = new Chart(document.getElementById('barChart').getContext('2d'), { 
        type: 'bar', 
        data: { 
          labels, 
          datasets: [{ label: 'Hábitos completados', data, backgroundColor: primaryColor }] 
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
      });

      let completed = data.reduce((a, b) => a + b, 0);
      let remaining = Math.max(0, (habits.length * days) - completed);
      
      if (doughnutChartInstance) doughnutChartInstance.destroy();
      doughnutChartInstance = new Chart(document.getElementById('doughnutChart').getContext('2d'), { 
        type: 'doughnut', 
        data: { 
          labels: ['Hecho', 'Pendiente'], 
          datasets: [{ data: [completed, remaining], backgroundColor: ['#10b981', borderCol] }] 
        },
        options: { responsive: true }
      });
    }

    function generateScriptWidgetCode(todayDone, totalHabits) {
      const pct = totalHabits > 0 ? Math.round((todayDone / totalHabits) * 100) : 0;
      const code = `// AetherHabit Widget - ScriptWidget
const canvas = new Canvas(300, 300);

// Fondo
canvas.setFillColor("#0b0f19");
canvas.fillRect(0, 0, 300, 300);

// Título
canvas.setTextColor("#6366f1");
canvas.setFont("Helvetica-Bold", 22);
canvas.drawText("🔥 AetherHabit", 20, 45);

// Estado de hoy
canvas.setTextColor("#f3f4f6");
canvas.setFont("Helvetica", 16);
canvas.drawText("Completados Hoy: ${todayDone} / ${totalHabits}", 20, 95);

// Barra de progreso (Fondo)
canvas.setFillColor("#273549");
canvas.fillRect(20, 120, 260, 16);

// Barra de progreso (Relleno)
canvas.setFillColor("#10b981");
canvas.fillRect(20, 120, Math.round(260 * (${pct} / 100)), 16);

// Porcentaje
canvas.setTextColor("#9ca3af");
canvas.setFont("Helvetica", 14);
canvas.drawText("Progreso: ${pct}%", 20, 165);

// Presentar en ScriptWidget
if (typeof config !== "undefined" && config.runsInWidget) {
  Script.setWidget(canvas);
} else {
  canvas.present();
}
Script.complete();`;

      document.getElementById('widget-code-text').innerText = code;
    }

    function switchView(id, btn) {
      document.querySelectorAll('.view-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active'); 
      btn.classList.add('active');
    }

    function openModal() { document.getElementById('habit-modal').classList.add('active'); }
    function closeModal() { document.getElementById('habit-modal').classList.remove('active'); }

    function saveNewHabit(e) {
      e.preventDefault(); 
      const input = document.getElementById('habit-name-input');
      const name = input.value.trim();
      if (name) { 
        habits.push({ id: Date.now().toString(), name, records: {} }); 
        saveState(); 
        renderMatrix(); 
        closeModal(); 
        input.value = ''; 
      }
    }

    function copyWidgetCode() { 
      navigator.clipboard.writeText(document.getElementById('widget-code-text').innerText); 
      alert('¡Código de ScriptWidget copiado al portapapeles!'); 
    }
  </script>
</body>
</html>
