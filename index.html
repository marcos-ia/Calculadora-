<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherHabit | Premium Habit Tracking</title>
  
  <!-- Tipografías: Abril Fatface (para los títulos retro/lujo) y Plus Jakarta (para lectura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Confetti para el refuerzo positivo -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* ==========================================
       PALETA BASE: COASTAL BLUE & VARIABLES DINÁMICAS
       ========================================== */
    :root {
      /* Valores por defecto (se pueden sobreescribir con el personalizador) */
      --bg-color: #F5EEDD;      /* Merino - Fondo */
      --panel-bg: #84B3CE;      /* Rock Blue - Paneles (usado con transparencia) */
      --text-main: #16587B;     /* Venice Blue - Textos oscuros y acentos */
      --text-light: #F5EEDD;    /* Merino - Textos sobre fondos oscuros */
      
      --radius: 12px;
      --shadow-sm: 0 4px 12px rgba(22, 88, 123, 0.1);
      --shadow-md: 0 8px 24px rgba(22, 88, 123, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s ease;
    }

    /* Fuentes de los títulos basadas en la imagen de la paleta */
    h1, h2, .brand {
      font-family: 'Abril Fatface', serif;
      font-weight: normal;
      letter-spacing: 1px;
    }

    /* --- NAVBAR Y PERSONALIZADOR --- */
    .navbar {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .brand {
      font-size: 28px;
      color: var(--text-main);
    }

    .nav-controls {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .color-picker-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .color-picker-group input[type="color"] {
      appearance: none;
      -webkit-appearance: none;
      border: 2px solid var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
    }
    
    .color-picker-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-group input[type="color"]::-webkit-color-swatch { border: none; }

    .premium-btn {
      background-color: var(--text-main);
      color: var(--text-light);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
    }

    .premium-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      opacity: 0.9;
    }

    /* --- CONTENEDOR PRINCIPAL --- */
    .container {
      width: 100%;
      max-width: 1100px;
      padding: 40px 20px;
    }

    .section-title {
      font-size: 38px;
      color: var(--text-main);
      margin-bottom: 30px;
    }

    /* --- AÑADIR HÁBITOS --- */
    .add-habit-card {
      background-color: rgba(132, 179, 206, 0.15); /* Rock Blue muy suave */
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      border: 1px solid var(--text-main);
    }

    .add-habit-card select,
    .add-habit-card input {
      padding: 14px 16px;
      border-radius: 8px;
      border: 2px solid var(--text-main);
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 500;
      outline: none;
    }

    .add-habit-card input {
      flex: 1;
    }

    .add-habit-card button {
      background-color: var(--text-main);
      color: var(--text-light);
      border: none;
      padding: 0 28px;
      border-radius: 8px;
      font-family: 'Abril Fatface', serif;
      font-size: 20px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .add-habit-card button:hover {
      opacity: 0.85;
    }

    /* --- TABLA DE HÁBITOS --- */
    .table-wrapper {
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
      border: 1px solid var(--text-main);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 16px 8px;
      text-align: center;
      border-bottom: 1px solid rgba(22, 88, 123, 0.2);
    }

    th {
      font-family: 'Abril Fatface', serif;
      font-size: 18px;
      color: var(--text-main);
    }

    tr:last-child td { border-bottom: none; }

    .col-habito {
      text-align: left;
      padding-left: 20px;
      min-width: 260px;
      font-weight: 600;
      font-size: 16px;
      color: var(--text-main);
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--text-main);
    }

    /* --- MODAL PREMIUM --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(22, 88, 123, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--bg-color);
      padding: 40px;
      border-radius: 16px;
      max-width: 420px;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      border: 4px solid var(--text-main);
    }

    .modal-content h2 {
      color: var(--text-main);
      margin-bottom: 15px;
      font-size: 32px;
    }

    .modal-content p {
      color: var(--text-main);
      margin-bottom: 25px;
      line-height: 1.6;
      font-weight: 500;
    }

    .price-tag {
      font-family: 'Abril Fatface', serif;
      font-size: 38px;
      color: var(--text-main);
      margin-bottom: 25px;
    }

    .close-modal {
      position: absolute;
      top: 15px; right: 20px;
      background: none; border: none;
      font-size: 28px; color: var(--text-main);
      cursor: pointer;
    }

    .btn-upgrade {
      background: var(--text-main);
      color: var(--text-light);
      border: none;
      padding: 16px 100%;
      width: 100%;
      border-radius: 8px;
      font-family: 'Abril Fatface', serif;
      font-size: 22px;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    
    .btn-upgrade:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN SaaS CON PERSONALIZADOR -->
  <nav class="navbar">
    <div class="brand">AetherHabit.</div>
    <div class="nav-controls">
      <div class="color-picker-group">
        Tema:
        <input type="color" id="picker-bg" title="Color de Fondo">
        <input type="color" id="picker-accent" title="Color de Textos/Acentos">
        <button onclick="resetColors()" style="background:none;border:none;cursor:pointer;font-size:18px;" title="Resetear a Coastal Blue">🔄</button>
      </div>
      <button class="premium-btn" onclick="abrirModal()">
        Upgrade to Pro - 3,99 €
      </button>
    </div>
  </nav>

  <div class="container">
    <h2 class="section-title">Tu progreso de este mes</h2>

    <!-- AÑADIR HÁBITO -->
    <div class="add-habit-card">
      <select id="emoji-select">
        <option value="🌊">🌊</option>
        <option value="🐚">🐚</option>
        <option value="🧘🏽‍♂️">🧘🏽‍♂️</option>
        <option value="💧">💧</option>
        <option value="📖">📖</option>
        <option value="🏃🏽‍♀️">🏃🏽‍♀️</option>
        <option value="🥗">🥗</option>
        <option value="💰">💰</option>
      </select>
      <input type="text" id="habit-input" placeholder="Cultiva un nuevo hábito...">
      <button onclick="agregarHabito()">Añadir</button>
    </div>

    <!-- TABLA -->
    <div class="table-wrapper">
      <table id="habit-table">
        <thead>
          <tr id="table-header">
            <th class="col-habito">HÁBITO</th>
            <!-- JS rellenará los 18 días -->
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- JS rellenará las filas -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL DE PAGO -->
  <div class="modal-overlay" id="premium-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="cerrarModal()">×</button>
      <h2>Desbloquea tu potencial</h2>
      <p>Has alcanzado el límite de la versión gratuita. Actualiza a <strong>Pro</strong> para añadir hábitos ilimitados y dominar tu rutina.</p>
      <div class="price-tag">3,99 €</div>
      <button class="btn-upgrade" onclick="simularPago()">Obtener Pro Ahora</button>
    </div>
  </div>

  <script>
    const TOTAL_DAYS = 18;
    const LIMITE_GRATIS = 4;

    /* ==========================================
       SISTEMA DE PERSONALIZACIÓN DE COLORES
       ========================================== */
    const root = document.documentElement;
    const pickerBg = document.getElementById("picker-bg");
    const pickerAccent = document.getElementById("picker-accent");

    // Colores por defecto (Coastal Blue)
    const DEFAULT_BG = "#F5EEDD";
    const DEFAULT_ACCENT = "#16587B";

    function aplicarColores(bg, accent) {
      root.style.setProperty('--bg-color', bg);
      root.style.setProperty('--text-main', accent);
      pickerBg.value = bg;
      pickerAccent.value = accent;
    }

    function cargarColores() {
      const savedBg = localStorage.getItem('aether_bg_color') || DEFAULT_BG;
      const savedAccent = localStorage.getItem('aether_accent_color') || DEFAULT_ACCENT;
      aplicarColores(savedBg, savedAccent);
    }

    function resetColors() {
      aplicarColores(DEFAULT_BG, DEFAULT_ACCENT);
      localStorage.removeItem('aether_bg_color');
      localStorage.removeItem('aether_accent_color');
    }

    // Escuchar cambios en los selectores
    pickerBg.addEventListener("input", (e) => {
      root.style.setProperty('--bg-color', e.target.value);
      localStorage.setItem('aether_bg_color', e.target.value);
    });

    pickerAccent.addEventListener("input", (e) => {
      root.style.setProperty('--text-main', e.target.value);
      localStorage.setItem('aether_accent_color', e.target.value);
    });

    /* ==========================================
       LÓGICA DE HÁBITOS
       ========================================== */
    let habitos = JSON.parse(localStorage.getItem('aether_premium_habits')) || [
      { name: "🌊 Meditación Matutina", days: Array(TOTAL_DAYS).fill(false) },
      { name: "🏃🏽‍♀️ Ejercicio Físico", days: Array(TOTAL_DAYS).fill(false) },
      { name: "📖 Leer 15 páginas", days: Array(TOTAL_DAYS).fill(false) }
    ];

    function guardarDatos() {
      localStorage.setItem('aether_premium_habits', JSON.stringify(habitos));
    }

    function renderizarTabla() {
      const headerRow = document.getElementById("table-header");
      headerRow.innerHTML = '<th class="col-habito">HÁBITO</th>';
      for (let i = 1; i <= TOTAL_DAYS; i++) {
        headerRow.innerHTML += `<th>${i}</th>`;
      }

      const tableBody = document.getElementById("table-body");
      tableBody.innerHTML = "";

      habitos.forEach((habito, index) => {
        let filaHtml = `<tr><td class="col-habito">${habito.name}</td>`;
        for (let day = 0; day < TOTAL_DAYS; day++) {
          const isChecked = habito.days[day] ? "checked" : "";
          filaHtml += `
            <td>
              <input type="checkbox" ${isChecked} 
                onchange="marcarDia(${index}, ${day}, this.checked)">
            </td>`;
        }
        filaHtml += `</tr>`;
        tableBody.innerHTML += filaHtml;
      });
    }

    function marcarDia(habitIndex, dayIndex, isChecked) {
      habitos[habitIndex].days[dayIndex] = isChecked;
      guardarDatos();
      
      if (isChecked) {
        // Confeti dinámico usando el color de acento actual
        const currentColor = root.style.getPropertyValue('--text-main') || DEFAULT_ACCENT;
        confetti({ 
          particleCount: 50, 
          spread: 60, 
          origin: { y: 0.8 }, 
          colors: [currentColor, '#ffffff', '#84B3CE'] 
        });
      }
    }

    function agregarHabito() {
      if (habitos.length >= LIMITE_GRATIS) {
        abrirModal();
        return;
      }

      const emoji = document.getElementById("emoji-select").value;
      const texto = document.getElementById("habit-input").value.trim();

      if (texto === "") return;

      habitos.push({
        name: `${emoji} ${texto}`,
        days: Array(TOTAL_DAYS).fill(false)
      });

      document.getElementById("habit-input").value = ""; 
      guardarDatos();
      renderizarTabla();
    }

    /* ==========================================
       MODAL DE PAGO
       ========================================== */
    function abrirModal() { document.getElementById("premium-modal").style.display = "flex"; }
    function cerrarModal() { document.getElementById("premium-modal").style.display = "none"; }
    function simularPago() { alert("Integración de pasarela de pago (Stripe/LemonSqueezy) aquí."); cerrarModal(); }

    // Iniciar aplicación
    window.onload = () => {
      cargarColores();
      renderizarTabla();
    };
  </script>
</body>
</html>
