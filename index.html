<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora iPhone Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BOTÓN SUPERIOR -->
    <button class="mode-btn" onclick="toggleScientific()">Calculadora científica</button>

    <div class="calculator">
        <div class="display" id="display">0</div>

        <div class="buttons basic">
            <button class="btn gray" onclick="clearDisplay()">AC</button>
            <button class="btn gray" onclick="invert()">±</button>
            <button class="btn gray" onclick="percent()">%</button>
            <button class="btn orange" onclick="setOperation('/')">÷</button>

            <button class="btn dark" onclick="appendNumber('7')">7</button>
            <button class="btn dark" onclick="appendNumber('8')">8</button>
            <button class="btn dark" onclick="appendNumber('9')">9</button>
            <button class="btn orange" onclick="setOperation('*')">×</button>

            <button class="btn dark" onclick="appendNumber('4')">4</button>
            <button class="btn dark" onclick="appendNumber('5')">5</button>
            <button class="btn dark" onclick="appendNumber('6')">6</button>
            <button class="btn orange" onclick="setOperation('-')">−</button>

            <button class="btn dark" onclick="appendNumber('1')">1</button>
            <button class="btn dark" onclick="appendNumber('2')">2</button>
            <button class="btn dark" onclick="appendNumber('3')">3</button>
            <button class="btn orange" onclick="setOperation('+')">+</button>

            <button class="btn dark zero" onclick="appendNumber('0')">0</button>
            <button class="btn dark" onclick="appendNumber('.')">.</button>
            <button class="btn orange" onclick="calculate()">=</button>
        </div>

        <!-- BOTONES CIENTÍFICOS (OCULTOS AL PRINCIPIO) -->
        <div class="buttons scientific hidden">
            <button class="btn sci" onclick="scientific('sin')">sin</button>
            <button class="btn sci" onclick="scientific('cos')">cos</button>
            <button class="btn sci" onclick="scientific('tan')">tan</button>
            <button class="btn sci" onclick="scientific('sqrt')">√</button>
            <button class="btn sci" onclick="scientific('pow')">x²</button>
            <button class="btn sci" onclick="appendNumber('(')">(</button>
            <button class="btn sci" onclick="appendNumber(')')">)</button>
            <button class="btn sci" onclick="appendNumber('π')">π</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
